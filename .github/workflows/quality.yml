name: Phase 1 quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm run export:web --workspace @bean-professor/mobile
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run export:native --workspace @bean-professor/mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-acceptance-results
          path: test-results/
          if-no-files-found: ignore
